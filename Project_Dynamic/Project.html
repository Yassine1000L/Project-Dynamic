<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FindInBrussels</title>

  <link rel="stylesheet" href="Project.css">
  <script type="module" src="Project.js" defer></script>
</head>

<body>

<header>
  <h1>FindInBrussels</h1>
  <p>Ontdek streetart in Brussel !</p>
</header>

<section class="knoppen">

  <button id="favorieten">Bekijk favorieten</button>

  <input type="text" id="zoekbalk" placeholder="Zoek een streetart of artiest op...">

  <button id="filterknop">Filter</button>

  <div id="filtermenu" class="onzichtbaarmenu">
    <label>Postcode:
      <select id="postcode">
        <option value="mogelijkheden">Alle postcodes</option>
      </select>
    </label>

    <label>Jaar:
      <select id="jaar">
        <option value="mogelijkheden">Alle jaren</option>
      </select>
    </label>
  </div>

  <select id="sorteerOpNaam">
    <option value="keuze">Sorteer op streetartnamen...</option>
    <option value="dalend">A-Z</option>
    <option value="stijgend">Z-A</option>
  </select>

  <select id="sorteerOpArtiest">
    <option value="keuze">Sorteer op Artiesten...</option>
    <option value="dalend">A-Z</option>
    <option value="stijgend">Z-A</option>
  </select>

</section>


<main id="resultaten"></main>

</body>
</html>
